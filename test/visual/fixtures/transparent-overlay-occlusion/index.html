<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; }
    #root, .scene, #frame-01-occlusion, .ground { position: absolute; inset: 0; width: 100%; height: 100%; }
    #root { background: #faf9f5; }
    #frame-01-occlusion { color: #141413; }
    .ground { background: #faf9f5; z-index: 0; }
    #covered-title { position: absolute; z-index: 1; left: 190px; top: 190px; width: 580px; margin: 0; font: 700 72px/1.1 Georgia, serif; }
    #opaque-marker { position: absolute; z-index: 2; left: 385px; top: 178px; width: 170px; height: 112px; border-radius: 56px; background: #cc785c; }
    #transparent-overlay { position: absolute; z-index: 3; inset: 0; background: rgba(0, 0, 0, 0); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main">
    <div id="el-01-occlusion" class="scene" data-composition-id="01-occlusion" data-start="0" data-duration="2">
      <div id="frame-01-occlusion" data-hf-inner-root="true" data-composition-id="01-occlusion" data-frame-theme="light">
        <div class="ground"></div>
        <h1 id="covered-title" data-load-bearing-text>Covered title</h1>
        <div id="opaque-marker"></div>
        <div id="transparent-overlay"></div>
      </div>
    </div>
  </div>
  <script>
    let time = 0;
    window.__player = { pause() {}, seek(next) { time = next; }, getTime() { return time; } };
    window.__timelines = { main: {}, '01-occlusion': {} };
  </script>
</body>
</html>
