<!doctype html><html><head><style>*{box-sizing:border-box}html,body{margin:0;width:960px;height:540px}#root,.scene,#frame,.ground{position:absolute;inset:0;width:100%;height:100%}#root{background:#fff}.ground{background-color:#fff;background-image:linear-gradient(#000,#000)}h1{position:absolute;left:100px;top:100px;color:#fff}#el-captions{pointer-events:none}.caption-group{position:absolute;left:100px;bottom:70px}.caption-word{color:#000;font:400 20px Arial}</style></head><body><div id="root"><div id="el-01-gradient-ground" class="scene" data-start="0" data-duration="1"><div id="frame" data-hf-inner-root="true" data-composition-id="01-gradient-ground" data-frame-theme="light"><div class="ground"></div><h1 data-load-bearing-text>Gradient ground</h1></div></div><div id="el-captions" class="scene"><div class="caption-group"><span id="word-gradient" class="caption-word">Gradient</span></div></div></div><script>let time=0;const word=document.getElementById('word-gradient');function update(t){time=t;word.className='caption-word';if(t>=.2&&t<.4)word.classList.add('is-active');else if(t>=.4)word.classList.add('is-spoken')}window.__player={pause(){},seek(t){update(t)},getTime(){return time}};update(0)</script></body></html>
