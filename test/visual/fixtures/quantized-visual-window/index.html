<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body, #root, .scene, #frame, .ground { margin: 0; position: absolute; inset: 0; width: 960px; height: 540px; }
    #root, .ground { background: #faf9f5; }
    h1 { position: absolute; left: 100px; top: 100px; color: #141413; }
  </style>
</head>
<body>
  <div id="root">
    <div id="el-01-visual-window" class="scene" data-start="0.02" data-duration="0.98">
      <div id="frame" data-hf-inner-root="true" data-composition-id="01-visual-window" data-frame-theme="light"><div class="ground"></div><h1 data-load-bearing-text>Visual window</h1></div>
    </div>
  </div>
  <script>
    let time = 0;
    window.__player = { pause() {}, seek(next) { time = Math.floor(next); }, getTime() { return time; } };
    window.__player.seek(0.02);
  </script>
</body>
</html>
