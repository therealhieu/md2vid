<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template data-composition-id="02-smoke">
      <div id="smoke2-root" data-composition-id="02-smoke" data-start="0" data-width="1920" data-height="1080" data-duration="3">
        <div id="s02-title" class="clip" data-start="0" data-duration="3" data-track-index="3">Offset smoke frame</div>
        <div id="s02-future" class="clip" data-start="0" data-duration="3" data-track-index="4">Second staged reveal</div>
        <div id="s02-late" class="clip" data-start="0" data-duration="3" data-track-index="5">Second late handoff</div>
      </div>
      <style>
        #smoke2-root { position: absolute; inset: 0; background: #f3f4f6; color: #1f2937; }
        #s02-title { position: absolute; left: 180px; top: 420px; font-size: 88px; }
        #s02-future { position: absolute; left: 180px; top: 570px; opacity: 0; }
        #s02-late { position: absolute; left: 180px; top: 660px; color: rgb(31, 41, 55); }
      </style>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.set("#s02-future", { opacity: 0 }, 0);
          tl.set("#s02-late", { color: "rgb(31, 41, 55)" }, 0);
          tl.to("#s02-future", { opacity: 1, duration: 0.2, ease: "none" }, 2);
          tl.set("#s02-late", { color: "rgb(93, 184, 114)" }, 2.7);
          tl.to("#s02-title", { opacity: 1, duration: 3, ease: "none" }, 0);
          window.__timelines["02-smoke"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
