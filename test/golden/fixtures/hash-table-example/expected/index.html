<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* bottom band — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: auto;
    bottom: 0;
    height: var(--cap-band-height, 200px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* no card — transparent, no border, no shadow, no radius */
  .caption-pill {
    max-width: 82%;
    padding: 0;
    background: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.3em;
    font-family: var(--font-display, "EB Garamond"), Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 3vw, 40px);
    line-height: 1.24;
    letter-spacing: -0.02em;
    /* faint cream halo so plain text stays legible over frame content */
    text-shadow: 0 1px 2px color-mix(in srgb, var(--cap-canvas, #faf9f5) 70%, transparent);
  }

  /* upcoming — faint warm ink, no underline */
  .caption-word {
    display: inline-block;
    padding: 0 0.02em 0.06em;
    color: color-mix(in srgb, var(--cap-ink, #141413) 40%, var(--cap-canvas, #faf9f5));
    border-bottom: 2px solid transparent;
  }
  /* current word — full ink under the coral voltage underline (the brand's signature
     inline-link gesture; border-bottom = underline without layout shift) */
  .caption-word.is-active {
    color: var(--cap-ink, #141413);
    border-bottom: 2px solid var(--cap-accent, #cc785c);
  }
  /* already spoken — solid warm ink, underline cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #141413);
    border-bottom: 2px solid transparent;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 94%;
    }
    .caption-line {
      font-size: clamp(24px, 4vw, 34px);
    }
  }
</style>
