name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: true

jobs:
  resolve-latest-node:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.node.outputs.version }}
    steps:
      - name: Set up latest Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
      - name: Resolve exact Node version
        id: node
        run: echo "version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|test|refactor|chore|ci|build)(\([a-z0-9._-]+\))?:[[:space:]][^[:space:]].*$ ]] && [[ ! "$PR_TITLE" =~ [[:punct:]]$ ]]; then
            if [[ "$PR_ACTOR" != "dependabot[bot]" && "$PR_AUTHOR" != "dependabot[bot]" && ! "$PR_HEAD_REF" =~ ^dependabot/ ]]; then
              test "${#PR_TITLE}" -le 72
              exit 0
            fi
          fi

          test "$PR_ACTOR" = "dependabot[bot]"
          test "$PR_AUTHOR" = "dependabot[bot]"
          if [[ ! "$PR_HEAD_REF" =~ ^dependabot/(npm_and_yarn|github_actions)/[^[:space:]]+$ ]]; then
            exit 1
          fi

          valid_count_word() {
            local count="$1"
            local word="$2"
            local singular="$3"
            local plural="$4"
            [[ "$count" =~ ^[1-9][0-9]*$ ]]
            if [[ "$count" = "1" ]]; then
              test "$word" = "$singular"
            else
              test "$word" = "$plural"
            fi
          }

          valid_group_branch() {
            local group="$1"
            case "$group" in
              runtime-patches|dev-patches|react-family|react-types-family|remotion-family)
                [[ "$PR_HEAD_REF" =~ ^dependabot/npm_and_yarn/${group}(-[a-z0-9]+)?$ ]]
                ;;
              actions-patches)
                [[ "$PR_HEAD_REF" =~ ^dependabot/github_actions/actions-patches(-[a-z0-9]+)?$ ]]
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [[ "$PR_TITLE" =~ ^chore\(deps\):\ bump\ the\ (runtime-patches|dev-patches|actions-patches|react-family|react-types-family|remotion-family)\ group\ with\ ([1-9][0-9]*)\ (update|updates)$ ]]; then
            group="${BASH_REMATCH[1]}"
            updates="${BASH_REMATCH[2]}"
            update_word="${BASH_REMATCH[3]}"
            valid_count_word "$updates" "$update_word" update updates
            valid_group_branch "$group"
            exit 0
          fi

          if [[ "$PR_TITLE" =~ ^chore\(deps\):\ bump\ the\ (runtime-patches|dev-patches|actions-patches|react-family|react-types-family|remotion-family)\ group\ across\ ([1-9][0-9]*)\ (directory|directories)\ with\ ([1-9][0-9]*)\ (update|updates)$ ]]; then
            group="${BASH_REMATCH[1]}"
            directories="${BASH_REMATCH[2]}"
            directory_word="${BASH_REMATCH[3]}"
            updates="${BASH_REMATCH[4]}"
            update_word="${BASH_REMATCH[5]}"
            valid_count_word "$directories" "$directory_word" directory directories
            valid_count_word "$updates" "$update_word" update updates
            valid_group_branch "$group"
            exit 0
          fi

          if [[ "$PR_TITLE" =~ ^chore\(deps\):\ bump\ ([^[:space:]]+)\ from\ ([^[:space:]]+)\ to\ ([^[:space:]]+)$ ]] && [[ ! "$PR_TITLE" =~ [[:punct:]]$ ]]; then
            exit 0
          fi

          exit 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  public-snapshot:
    uses: ./.github/workflows/validate.yml
    with:
      runner: ubuntu-latest
      node-version: 22.18.0
      mode: public-snapshot
      audit: false
    permissions:
      contents: read

  pr-minimum:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/validate.yml
    with:
      runner: ubuntu-latest
      node-version: 22.18.0
      mode: fast
      audit: false
    permissions:
      contents: read

  pr-latest:
    if: github.event_name == 'pull_request'
    needs: resolve-latest-node
    uses: ./.github/workflows/validate.yml
    with:
      runner: ubuntu-latest
      node-version: ${{ needs.resolve-latest-node.outputs.version }}
      mode: fast
      audit: false
    permissions:
      contents: read

  main-full:
    if: github.event_name == 'push'
    needs: resolve-latest-node
    uses: ./.github/workflows/validate.yml
    with:
      runner: ubuntu-latest
      node-version: ${{ needs.resolve-latest-node.outputs.version }}
      mode: full
      audit: false
    permissions:
      contents: read
