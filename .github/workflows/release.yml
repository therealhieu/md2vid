name: Release

# Publication-capable; never dispatch as a rollout dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: md2vid-release
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      version: ${{ steps.preflight.outputs.version }}
      commit: ${{ steps.preflight.outputs.commit }}
      node_version: ${{ steps.preflight.outputs.node_version }}
      registry_state: ${{ steps.preflight.outputs.registry_state }}
      registry_integrity: ${{ steps.preflight.outputs.registry_integrity }}
      github_release_state: ${{ steps.preflight.outputs.github_release_state }}
      artifact_name: ${{ steps.preflight.outputs.artifact_name }}
      artifact_id: ${{ steps.preflight.outputs.artifact_id }}
      artifact_run_id: ${{ steps.preflight.outputs.artifact_run_id }}
    steps:
      - name: Check out full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node resolver
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Validate release preflight
        id: preflight
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME" in
            push) event_kind=push ;;
            workflow_dispatch) event_kind=recovery ;;
            *) echo "unsupported release event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          node scripts/release_preflight.ts preflight \
            --tag "$tag" \
            --repository "$GITHUB_REPOSITORY" \
            --event "$event_kind"
      - name: Summarize preflight
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.preflight.outputs.tag }}
          VERSION: ${{ steps.preflight.outputs.version }}
          COMMIT: ${{ steps.preflight.outputs.commit }}
          NODE_VERSION: ${{ steps.preflight.outputs.node_version }}
          REGISTRY_STATE: ${{ steps.preflight.outputs.registry_state }}
          RELEASE_STATE: ${{ steps.preflight.outputs.github_release_state }}
          ARTIFACT_NAME: ${{ steps.preflight.outputs.artifact_name }}
          ARTIFACT_ID: ${{ steps.preflight.outputs.artifact_id }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Release preflight"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- Registry state: $REGISTRY_STATE"
            echo "- GitHub Release state: $RELEASE_STATE"
            echo "- Artifact name: $ARTIFACT_NAME"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  obtain-artifact:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tarball: ${{ steps.artifact.outputs.tarball }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      version: ${{ steps.artifact.outputs.version }}
      tag: ${{ steps.artifact.outputs.tag }}
      commit: ${{ steps.artifact.outputs.commit }}
      artifact_id: ${{ steps.current-artifact.outputs.artifact_id || steps.upload-artifact.outputs['artifact-id'] }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.preflight.outputs.node_version }}
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Find reusable current-run artifact
        id: current-artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=current-run-artifacts.json
          trap 'rm -f "$response"' EXIT
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            -f "name=$ARTIFACT_NAME" \
            -f "per_page=100" > "$response"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync("current-run-artifacts.json", "utf8"));
          const name = process.env.ARTIFACT_NAME;
          if (!value || !Number.isInteger(value.total_count) || !Array.isArray(value.artifacts)) throw new Error("malformed current-run artifact response");
          if (value.total_count !== value.artifacts.length) throw new Error("incomplete current-run artifact response");
          if (value.artifacts.length > 1) throw new Error("duplicate current-run release artifacts");
          if (value.artifacts.length === 0) {
            console.log("reuse=false");
          } else {
            const artifact = value.artifacts[0];
            if (!artifact || !Number.isSafeInteger(artifact.id) || artifact.id <= 0) throw new Error("invalid current-run artifact id");
            if (artifact.name !== name) throw new Error("current-run artifact name mismatch");
            if (artifact.expired !== false) throw new Error("current-run artifact is expired");
            const expiresAt = Date.parse(artifact.expires_at);
            if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) throw new Error("current-run artifact expiry is invalid");
            console.log("reuse=true");
            console.log(`artifact_id=${artifact.id}`);
          }
          NODE
      - name: Download reusable current-run artifact
        if: steps.current-artifact.outputs.reuse == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.current-artifact.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release-artifact
      - name: Install dependencies for new artifact
        if: needs.preflight.outputs.registry_state == 'absent' && steps.current-artifact.outputs.reuse != 'true'
        run: npm ci
      - name: Validate source for new artifact
        if: needs.preflight.outputs.registry_state == 'absent' && steps.current-artifact.outputs.reuse != 'true'
        run: npm run check
      - name: Audit dependency signatures
        if: needs.preflight.outputs.registry_state == 'absent' && steps.current-artifact.outputs.reuse != 'true'
        run: npm audit signatures
      - name: Enforce production audit policy
        if: needs.preflight.outputs.registry_state == 'absent' && steps.current-artifact.outputs.reuse != 'true'
        run: npm run security:audit
      - name: Pack new release artifact
        if: needs.preflight.outputs.registry_state == 'absent' && steps.current-artifact.outputs.reuse != 'true'
        env:
          MD2VID_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          MD2VID_RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: npm run release:pack -- --output release-artifact
      - name: Download retained release artifact
        if: needs.preflight.outputs.registry_state == 'existing' && steps.current-artifact.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          run-id: ${{ needs.preflight.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release-artifact
      - name: Validate artifact metadata and checksums
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [path, version, tag, commit] = process.argv.slice(1);
            const value = JSON.parse(readFileSync(path, "utf8"));
            if (value.version !== version || value.tag !== tag || value.commit !== commit) throw new Error("artifact identity mismatch");
            if (typeof value.tarball !== "string" || !/^md2vid-[A-Za-z0-9._-]+\.tgz$/.test(value.tarball)) throw new Error("unsafe artifact tarball name");
            process.stdout.write(value.tarball);
          ' release-artifact/artifact.json "$VERSION" "$TAG" "$COMMIT" > release-artifact/tarball-name.txt
          TARBALL=$(<release-artifact/tarball-name.txt)
          npm run release:verify-artifact -- \
            --tarball "release-artifact/$TARBALL" \
            --metadata release-artifact/artifact.json \
            --expected-version "$VERSION" \
            --expected-tag "$TAG" \
            --expected-commit "$COMMIT" \
            --metadata-only
          rm release-artifact/tarball-name.txt
      - name: Export validated artifact outputs
        id: artifact
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync("release-artifact/artifact.json", "utf8"));
          const expected = { version: process.env.VERSION, tag: process.env.TAG, commit: process.env.COMMIT };
          for (const [key, wanted] of Object.entries(expected)) {
            if (value[key] !== wanted) throw new Error(`artifact ${key} output mismatch`);
          }
          if (typeof value.tarball !== "string" || !/^md2vid-[A-Za-z0-9._-]+\.tgz$/.test(value.tarball)) throw new Error("unsafe artifact tarball name");
          if (typeof value.integrity !== "string" || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(value.integrity)) throw new Error("invalid artifact integrity");
          if (typeof value.sha256 !== "string" || !/^[a-f0-9]{64}$/.test(value.sha256)) throw new Error("invalid artifact sha256");
          for (const key of ["tarball", "integrity", "sha256", "version", "tag", "commit"]) console.log(`${key}=${value[key]}`);
          NODE
      - name: Upload current release artifact
        id: upload-artifact
        if: steps.current-artifact.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Summarize artifact acquisition
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.artifact.outputs.tag }}
          VERSION: ${{ steps.artifact.outputs.version }}
          COMMIT: ${{ steps.artifact.outputs.commit }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          ARTIFACT_ID: ${{ steps.current-artifact.outputs.artifact_id || steps.upload-artifact.outputs['artifact-id'] }}
          NODE_VERSION: ${{ needs.preflight.outputs.node_version }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Release artifact"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- Artifact name: $ARTIFACT_NAME"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- SRI: $INTEGRITY"
            echo "- SHA-256: $SHA256"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-artifact:
    needs: [preflight, obtain-artifact]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Download current release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-artifact
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.preflight.outputs.node_version }}
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - name: Install Linux media tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Verify exact release artifact
        shell: bash
        env:
          TARBALL: ${{ needs.obtain-artifact.outputs.tarball }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
          MD2VID_DIAGNOSTICS_DIR: release-diagnostics
        run: |
          npm run release:verify-artifact -- \
            --tarball "release-artifact/$TARBALL" \
            --metadata release-artifact/artifact.json \
            --expected-version "$VERSION" \
            --expected-tag "$TAG" \
            --expected-commit "$COMMIT" \
            --diagnostics release-diagnostics
      - name: Upload sanitized release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.runner }}-${{ needs.obtain-artifact.outputs.tag }}
          path: release-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize native verification
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          SHA256: ${{ needs.obtain-artifact.outputs.sha256 }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.obtain-artifact.outputs.artifact_id }}
          NODE_VERSION: ${{ needs.preflight.outputs.node_version }}
          RUNNER: ${{ matrix.runner }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Native artifact verification"
            echo "- Runner: $RUNNER"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- Artifact name: $ARTIFACT_NAME"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- SRI: $INTEGRITY"
            echo "- SHA-256: $SHA256"
            echo "- Matrix result: $STATUS"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    needs: [preflight, obtain-artifact, verify-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.preflight.outputs.node_version }}
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-artifact
      - name: Install publication verification dependencies
        run: npm ci --ignore-scripts
      - name: Verify publication artifact metadata
        shell: bash
        env:
          TARBALL: ${{ needs.obtain-artifact.outputs.tarball }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
        run: |
          npm run release:verify-artifact -- \
            --tarball "release-artifact/$TARBALL" \
            --metadata release-artifact/artifact.json \
            --expected-version "$VERSION" \
            --expected-tag "$TAG" \
            --expected-commit "$COMMIT" \
            --metadata-only
      - name: Check whether npm publication is required
        id: publish-check
        shell: bash
        env:
          TARBALL: ${{ needs.obtain-artifact.outputs.tarball }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
        run: |
          node scripts/release_preflight.ts publish-check \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact release-artifact/artifact.json
      - name: Publish exact tarball to npm
        if: steps.publish-check.outputs.publish == 'true'
        shell: bash
        env:
          TARBALL: ${{ needs.obtain-artifact.outputs.tarball }}
        run: npm publish "./release-artifact/$TARBALL" --access public --tag latest
      - name: Record equal-integrity recovery
        if: steps.publish-check.outputs.publish == 'false'
        run: echo "equal-integrity recovery; npm publication skipped"
      - name: Summarize npm publication
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          SHA256: ${{ needs.obtain-artifact.outputs.sha256 }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.obtain-artifact.outputs.artifact_id }}
          NODE_VERSION: ${{ needs.preflight.outputs.node_version }}
          REGISTRY_STATE: ${{ needs.preflight.outputs.registry_state }}
          PUBLISH: ${{ steps.publish-check.outputs.publish }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### npm publication"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- Artifact name: $ARTIFACT_NAME"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- SRI: $INTEGRITY"
            echo "- SHA-256: $SHA256"
            echo "- Registry state: $REGISTRY_STATE"
            echo "- Publish state: $PUBLISH"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-registry:
    needs: [preflight, obtain-artifact, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.preflight.outputs.node_version }}
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Install registry verification dependencies
        run: npm ci --ignore-scripts
      - name: Verify public registry artifact
        shell: bash
        env:
          TARBALL: ${{ needs.obtain-artifact.outputs.tarball }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
          MD2VID_DIAGNOSTICS_DIR: release-diagnostics
        run: |
          npm run release:verify-registry -- \
            --version "$VERSION" \
            --integrity "$INTEGRITY" \
            --diagnostics release-diagnostics
      - name: Upload sanitized registry diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-registry-${{ needs.obtain-artifact.outputs.tag }}
          path: release-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize registry verification
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.obtain-artifact.outputs.tag }}
          VERSION: ${{ needs.obtain-artifact.outputs.version }}
          COMMIT: ${{ needs.obtain-artifact.outputs.commit }}
          INTEGRITY: ${{ needs.obtain-artifact.outputs.integrity }}
          SHA256: ${{ needs.obtain-artifact.outputs.sha256 }}
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.obtain-artifact.outputs.artifact_id }}
          NODE_VERSION: ${{ needs.preflight.outputs.node_version }}
          REGISTRY_STATE: ${{ needs.preflight.outputs.registry_state }}
          PUBLIC_INSTALL_RESULT: ${{ job.status }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Registry verification"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- Artifact name: $ARTIFACT_NAME"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- SRI: $INTEGRITY"
            echo "- SHA-256: $SHA256"
            echo "- Registry state: $REGISTRY_STATE"
            echo "- Public install result: $PUBLIC_INSTALL_RESULT"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  create-github-release:
    needs: [preflight, verify-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.preflight.outputs.node_version }}
          cache: npm
      - name: Install pinned npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          expected=${package_manager#npm@}
          npm install --global "$package_manager"
          test "$(npm --version)" = "$expected"
          test "$expected" = "11.15.0"
      - name: Re-query GitHub Release state
        id: release-check
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release_preflight.ts release-check \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$COMMIT"
      - name: Create or accept GitHub Release
        id: release
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_STATE: ${{ steps.release-check.outputs.github_release_state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_STATE" in
            absent)
              gh release create "$TAG" \
                --verify-tag \
                --target "$COMMIT" \
                --title "md2vid $TAG" \
                --generate-notes
              echo "release_state=created" >> "$GITHUB_OUTPUT"
              ;;
            matching)
              echo "matching GitHub Release already exists"
              echo "release_state=matching" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "unexpected release state" >&2; exit 1 ;;
          esac
      - name: Summarize GitHub Release
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          NODE_VERSION: ${{ needs.preflight.outputs.node_version }}
          RELEASE_STATE: ${{ steps.release.outputs.release_state || steps.release-check.outputs.github_release_state || needs.preflight.outputs.github_release_state }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### GitHub Release"
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Commit: $COMMIT"
            echo "- Node: $NODE_VERSION"
            echo "- npm: 11.15.0"
            echo "- GitHub Release state: $RELEASE_STATE"
            echo "- Status: $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
